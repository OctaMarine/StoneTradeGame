<svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиент основного тела (Темно-красный -> Черный) -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a0000" />
      <stop offset="40%" stop-color="#8b0000" />
      <stop offset="100%" stop-color="#1a0000" />
    </linearGradient>

    <!-- Градиент для огненных трещин (Белый -> Желтый -> Оранжевый) -->
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ffea00" />
      <stop offset="70%" stop-color="#ff6600" />
      <stop offset="100%" stop-color="#cc0000" />
    </linearGradient>

    <!-- Фильтр для мягкого свечения трещин -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Фильтр для сильного внешнего свечения (опционально, можно управлять через CSS drop-shadow) -->
    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="1.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Группа кристалла (смещена для центрирования) -->
  <g transform="translate(10, 10)">
    
    <!-- === ТЕНЬ / ЗАДНЯЯ ГРАНЬ === -->
    <path d="M90,20 L145,85 L135,230 L80,270 L35,205 L45,55 Z" fill="#0d0000" opacity="0.9"/>

    <!-- === ОСНОВНЫЕ ГРАНИ === -->
    <!-- Левая грань -->
    <path d="M90,20 L45,55 L35,205 L80,270 L95,145 Z" fill="url(#bodyGrad)" stroke="#3a0000" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Правая грань -->
    <path d="M90,20 L145,85 L135,230 L80,270 L95,145 Z" fill="url(#bodyGrad)" stroke="#3a0000" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Центральная грань (блик объема) -->
    <path d="M90,20 L95,145 L80,270 L115,215 L125,90 Z" fill="#7a0000" opacity="0.4"/>

    <!-- === ОГНЕННЫЕ ТРЕЩИНЫ (Свечение внутри) === -->
    <g filter="url(#glow)">
      <!-- Главный разлом -->
      <path d="M90,25 L82,95 L105,135 L80,190 L95,255" fill="none" stroke="url(#fireGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Боковые ответвления -->
      <path d="M82,95 L55,115 M105,135 L130,145 M80,190 L50,200 M95,255 L110,240" fill="none" stroke="url(#fireGrad)" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Мелкие искры / точки энергии -->
      <circle cx="95" cy="135" r="2.5" fill="#ffffff" />
      <circle cx="80" cy="190" r="2" fill="#ffcc00" />
      <circle cx="88" cy="60" r="1.5" fill="#ffaa00" />
    </g>

    <!-- === БЛИКИ (Стекло / Полировка) === -->
    <!-- Верхний левый блик -->
    <path d="M88,28 L96,85 L88,135" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Боковой блик -->
    <path d="M52,65 L62,125" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Нижний блик -->
    <path d="M85,260 L92,220" fill="none" stroke="rgba(255,200,200,0.3)" stroke-width="1.5" stroke-linecap="round"/>

  </g>
</svg>